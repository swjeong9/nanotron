checkpoints:
  # Benchmark 용도. 학습된 weight 저장 안 함.
  checkpoint_interval: 999999
  checkpoints_path: /opt/dlami/nvme/alpaca_qwen3_14b_pp2_tp8_fp16_ckpts
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: /opt/dlami/nvme/qwen-3-14b_nanotron
  save_initial_state: false
  save_final_state: false
  load_lr_scheduler: false
  load_optimizer: false
data_stages:
- data:
    dataset:
      hf_dataset_or_datasets: /opt/dlami/nvme/alpaca_sft_local
      hf_dataset_splits: train
      hf_dataset_config_name: null
      dataset_processing_num_proc_per_process: 4
      dataset_overwrite_cache: false
      sft_dataloader: true
      debug_max_samples: null
    num_loading_workers: 2
    seed: 42
  name: AlpacaSFTStage
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: heterogeneous
  run: qwen3_14b_alpaca_pp2_tp8_p3dn_24xl__p4dn_24xl
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  # V100 (Volta) 은 BF16 Tensor Core 미지원 (FP16 only). p4dn 의 A100 도 FP16 OK.
  # Cross-node tensor 의 dtype 일치 필요 → cluster 전체 FP16.
  dtype: float16
  init_method:
    std: 0.02
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 151643
    eos_token_id: 151645
    hidden_act: silu
    hidden_size: 5120
    initializer_range: 0.02
    intermediate_size: 17408
    is_qwen2_config: true
    max_position_embeddings: 40960
    num_attention_heads: 40
    num_hidden_layers: 40
    num_key_value_heads: 8
    head_dim: 128
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000.0
    rope_interleaved: false
    tie_word_embeddings: false
    use_cache: true
    vocab_size: 151936
    # V100 (Volta) 은 FlashAttention 미지원 (Ampere+ 만). sdpa 사용 — A100 도 OK.
    _attn_implementation: xformers
    attention_bias: false
    _use_qk_norm: true
    _use_doc_masking: true
    log_attn_probs: false
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 2.0e-05
    lr_decay_starting_step: null
    lr_decay_steps: 4
    lr_decay_style: cosine
    lr_warmup_steps: 1
    lr_warmup_style: linear
    min_decay_lr: 2.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0
parallelism:
  dp: 1
  expert_parallel_size: 1
  pp: 2
  pp_engine: 1f1b
  # p3dn (V100 32GB ×8) = stage 0, p4dn (A100 ×8) = stage 1.
  # V100 32GB < A100 40GB 라 stage 0 가 더 빡빡 — 균등 [20, 20] 출발 후 sweep 으로 확인.
  pp_layer_partition: [28, 12]
  recompute_layer: true
  tp: 8
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: /opt/dlami/nvme/qwen-3-14b_nanotron
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 16
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 2
  sequence_length: 8192
  train_steps: 3
  val_check_interval: -1
