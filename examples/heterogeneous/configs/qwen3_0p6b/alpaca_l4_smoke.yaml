checkpoints:
  # Smoke run — checkpoint 저장 / 로드 모두 의도적으로 skip.
  checkpoint_interval: 999999
  checkpoints_path: /tmp/nanotron_qwen3_smoke_ckpts
  checkpoints_path_is_shared_file_system: false
  # nanotron 으로 변환된 Qwen3-0.6B (convert_and_upload.sh ARCH=qwen3 결과).
  # parse_ckpt_path 가 ``<path>/model_config.json`` 을 보고 trigger 하므로 outer 경로 지정.
  resume_checkpoint_path: /opt/dlami/nvme/qwen-3-0.6b_nanotron
  save_initial_state: false
  save_final_state: false
  load_lr_scheduler: false
  load_optimizer: false
data_stages:
- data:
    dataset:
      hf_dataset_or_datasets: /opt/dlami/nvme/alpaca_sft_local
      hf_dataset_splits: train
      hf_dataset_config_name: null
      dataset_processing_num_proc_per_process: 4
      dataset_overwrite_cache: false
      sft_dataloader: true
      debug_max_samples: null
    num_loading_workers: 1
    seed: 42
  name: AlpacaSFTStage
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: smoke
  run: qwen3_0p6b_l4_smoke
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    std: 0.02
  make_vocab_size_divisible_by: 1
  # Qwen 3 0.6B — HF Qwen/Qwen3-0.6B/config.json 와 정합. Qwen 3 만의 추가 필드:
  #   head_dim=128 (∵ 1024/16=64 ≠ 128, q_proj 비대칭)
  #   _use_qk_norm=true (q_norm/k_norm RMSNorm before RoPE)
  #   attention_bias=false
  model_config:
    bos_token_id: 151643
    eos_token_id: 151645
    hidden_act: silu
    hidden_size: 1024
    initializer_range: 0.02
    intermediate_size: 3072
    is_qwen2_config: true
    max_position_embeddings: 40960
    num_attention_heads: 16
    num_hidden_layers: 28
    num_key_value_heads: 8
    head_dim: 128
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000.0
    rope_interleaved: false
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 151936
    _attn_implementation: flash_attention_2
    attention_bias: false
    _use_qk_norm: true
    _use_doc_masking: true
    log_attn_probs: false
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 2.0e-05
    lr_decay_starting_step: null
    lr_decay_steps: 4
    lr_decay_style: cosine
    lr_warmup_steps: 1
    lr_warmup_style: linear
    min_decay_lr: 2.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0
parallelism:
  dp: 1
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  recompute_layer: false
  tp: 1
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: /opt/dlami/nvme/qwen-3-0.6b_nanotron
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 1
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 1
  sequence_length: 1024
  train_steps: 3
  val_check_interval: -1
