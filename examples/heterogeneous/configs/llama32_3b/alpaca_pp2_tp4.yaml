checkpoints:
  # Benchmark 용도라 학습된 weight 가 필요 없음. interval 을 train_steps 보다
  # 크게 두고 save_final_state 도 false 로 두어 종료 직전 final save 까지
  # 모두 skip.
  checkpoint_interval: 999999
  checkpoints_path: /opt/dlami/nvme/alpaca_3b_pp2_tp4_ckpts
  checkpoints_path_is_shared_file_system: false
  # Llama 3.2 3B 의 nanotron 변환 checkpoint. S3 또는 변환 스크립트로 미리 준비:
  #   aws s3 sync s3://swj-nanotron-model/llama-3.2-3b/nanotron/ /opt/dlami/nvme/llama32_3b_nanotron/
  resume_checkpoint_path: /opt/dlami/nvme/llama32_3b_nanotron/model
  save_initial_state: false
  save_final_state: false
  load_lr_scheduler: false
  load_optimizer: false
data_stages:
- data:
    dataset:
      hf_dataset_or_datasets: /opt/dlami/nvme/alpaca_sft_local
      hf_dataset_splits: train
      hf_dataset_config_name: null
      dataset_processing_num_proc_per_process: 4
      dataset_overwrite_cache: false
      sft_dataloader: true
      debug_max_samples: null
    num_loading_workers: 2
    seed: 42
  name: AlpacaSFTStage
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: heterogeneous
  run: llama32_3b_alpaca_pp2_tp4_l4_4__a10g_4
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    std: 0.02
  make_vocab_size_divisible_by: 1
  # Llama 3.2 3B (3.21B params) — HF meta-llama/Llama-3.2-3B/config.json 와 일치.
  model_config:
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 3072
    initializer_range: 0.02
    intermediate_size: 8192
    is_qwen2_config: true
    max_position_embeddings: 131072
    num_attention_heads: 24
    num_hidden_layers: 28
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling:
      factor: 32.0
      high_freq_factor: 4.0
      low_freq_factor: 1.0
      original_max_position_embeddings: 8192
      rope_type: llama3
    rope_theta: 500000.0
    rope_interleaved: false
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
    _attn_implementation: flash_attention_2
    attention_bias: false
    _use_doc_masking: true
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 2.0e-05
    lr_decay_starting_step: null
    lr_decay_steps: 4
    lr_decay_style: cosine
    lr_warmup_steps: 1
    lr_warmup_style: linear
    min_decay_lr: 2.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0
parallelism:
  dp: 1
  expert_parallel_size: 1
  pp: 2
  pp_engine: 1f1b
  # 28 layer 균등 분할 — 한 stage 당 14 layer. 비대칭 sweep 시 sed 으로 override.
  pp_layer_partition: [14, 14]
  recompute_layer: false
  tp: 4                                # intra-node TP=4 (4 GPU/node)
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
profiler: null
tokenizer:
  tokenizer_max_length: null
  # 로컬 경로 사용 — HF gated repo 401 회피. 양 worker 노드에 tokenizer 파일이
  # /opt/dlami/nvme/llama32_3b_nanotron/tokenizer/ 에 미리 sync 되어 있어야 함.
  tokenizer_name_or_path: /opt/dlami/nvme/llama32_3b_nanotron/tokenizer
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 64
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 2
  sequence_length: 1024
  train_steps: 10
  val_check_interval: -1
